<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte avis Radialec</title>
<!--
  Carte de visite « avis Google » à laisser après chaque intervention.
  Format imprimeur : 85 × 55 mm + 3 mm de fond perdu (91 × 61 mm), recto (merci + QR)
  puis verso (prochain entretien). Exporter en PDF : voir README du kit (Chrome sans tête).
  Le QR pointe vers https://www.radialec.be/avis (redirection, next.config.ts).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Geist:wght@800&display=block" rel="stylesheet">
<style>
  @page { size: 91mm 61mm; margin: 0; }
  :root { --night: #0B1222; --lavender: #EAEEFE; --flame: #E52619; --ember: #ED7020; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body { font-family: "Archivo", system-ui, sans-serif; color: var(--night); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  /* Une page = la carte + 3 mm de fond perdu ; tout le contenu reste à 3 mm au moins du trait de coupe. */
  .page { width: 91mm; height: 61mm; padding: 6mm; position: relative; overflow: hidden; break-after: page; display: flex; }
  .page:last-child { break-after: auto; }
  .energy { height: 0.7mm; width: 9mm; border-radius: 1mm; background: linear-gradient(90deg, #e52619 0%, #ed7020 28%, #ffd505 52%, #38b7e8 76%, #3468af 100%); }
  .brand { display: flex; align-items: center; gap: 1.6mm; }
  .brand img { height: 6.2mm; width: auto; }
  .brand span { font-family: "Geist", sans-serif; font-weight: 800; font-size: 4.1mm; letter-spacing: -0.02em; }

  /* Recto */
  .recto { gap: 4mm; }
  .recto .text { flex: 1; display: flex; flex-direction: column; }
  .recto h1 { font-size: 4.6mm; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em; margin-top: auto; }
  .recto .energy { margin-top: 3.4mm; }
  .recto p { font-size: 2.55mm; line-height: 1.4; color: rgba(11, 18, 34, 0.72); margin-top: 2.2mm; }
  .recto .qr { width: 27mm; border-radius: 2.6mm; background: var(--lavender); padding: 2.4mm 2.4mm 2mm; display: flex; flex-direction: column; align-items: center; align-self: center; }
  .recto .qr img { width: 22.2mm; height: 22.2mm; display: block; border: 1.2mm solid #fff; border-radius: 1mm; background: #fff; }
  .recto .qr strong { font-size: 2.2mm; font-weight: 600; margin-top: 1.6mm; text-align: center; line-height: 1.25; }
  .recto .qr small { font-size: 2.15mm; font-weight: 800; margin-top: 0.6mm; letter-spacing: -0.01em; }

  /* Verso */
  .verso { flex-direction: column; justify-content: space-between; }
  .verso .eyebrow { display: flex; align-items: center; gap: 1.8mm; font-size: 2mm; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(11, 18, 34, 0.6); }
  .verso h2 { font-size: 4.4mm; font-weight: 800; letter-spacing: -0.02em; margin-top: 1.6mm; }
  .verso .date { display: flex; align-items: flex-end; gap: 1.6mm; font-size: 2.8mm; margin-top: 3.2mm; color: rgba(11, 18, 34, 0.7); }
  .verso .date i { display: inline-block; border-bottom: 0.25mm solid rgba(11, 18, 34, 0.45); height: 4.2mm; }
  .verso .bottom { display: flex; align-items: center; justify-content: space-between; gap: 3mm; }
  .verso .phone { display: inline-flex; align-items: center; gap: 1.4mm; border-radius: 99mm; padding: 1.6mm 3.2mm; color: #fff; font-weight: 800; font-size: 2.9mm; letter-spacing: -0.01em; background: radial-gradient(circle at 30% 20%, #ed7020 0%, #e52619 70%); }
  .verso .phone svg { width: 2.6mm; height: 2.6mm; fill: #fff; }
  .verso .meta { font-size: 2.1mm; line-height: 1.35; text-align: right; color: rgba(11, 18, 34, 0.6); }
</style>
</head>
<body>
  <section class="page recto">
    <div class="text">
      <div class="brand"><img src="../../../assets/logo.png" alt=""><span>Radialec</span></div>
      <h1>Merci pour votre confiance.</h1>
      <div class="energy"></div>
      <p>Votre avis Google aide d'autres familles à choisir un technicien de confiance. Il ne prend que 30&nbsp;secondes.</p>
    </div>
    <div class="qr">
      <img src="qr-avis.svg" alt="QR code vers le formulaire d'avis Google de Radialec">
      <strong>Scannez pour donner votre avis</strong>
      <small>radialec.be/avis</small>
    </div>
  </section>

  <section class="page verso">
    <div>
      <p class="eyebrow"><span class="energy"></span>Entretien</p>
      <h2>Votre prochain entretien</h2>
      <p class="date">Le <i style="width: 8mm"></i>/<i style="width: 8mm"></i>/<i style="width: 14mm"></i></p>
    </div>
    <div class="bottom">
      <span class="phone">
        <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M497.39 361.8l-112-48a24 24 0 0 0-28 6.9l-49.6 60.6A370.66 370.66 0 0 1 130.6 204.11l60.6-49.6a23.94 23.94 0 0 0 6.9-28l-48-112A24.16 24.16 0 0 0 122.6.61l-104 24A24 24 0 0 0 0 48c0 256.5 207.9 464 464 464a24 24 0 0 0 23.4-18.6l24-104a24.29 24.29 0 0 0-14.01-27.6z"/></svg>
        +32 486 44 21 86
      </span>
      <p class="meta">7j/7 · 10h–21h<br>radialec.be</p>
    </div>
  </section>
</body>
</html>
